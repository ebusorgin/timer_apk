<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=2.0.0">
    <style>
        body {
            overflow-y: auto !important;
            height: auto !important;
            min-height: 100vh;
        }

        .admin-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
            min-height: 100vh;
        }

        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .admin-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .admin-stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .admin-stat {
            background: var(--bg-secondary);
            padding: 16px 20px;
            border-radius: var(--radius-md);
            min-width: 140px;
        }

        .admin-stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .admin-stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .admin-online-list {
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .admin-online-list h3 {
            padding: 16px;
            margin: 0;
            font-size: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .admin-online-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: background 0.15s;
        }

        .admin-online-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .admin-online-item:last-child {
            border-bottom: none;
        }

        .admin-online-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .admin-online-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .admin-online-name {
            font-weight: 500;
        }

        .admin-online-id {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .admin-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--success);
            color: white;
        }

        .admin-source {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .admin-user-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .admin-user-table th {
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-weight: 500;
        }

        .admin-user-table td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .admin-user-table tr:last-child td {
            border-bottom: none;
        }

        .admin-user-table tbody tr {
            cursor: pointer;
            transition: background 0.15s;
        }

        .admin-user-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .pagination-btn {
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--glass-border);
            background: var(--bg-input);
            cursor: pointer;
            color: var(--text-primary);
        }

        .pagination-btn:hover {
            background: var(--bg-secondary);
        }

        .pagination-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== Профиль пользователя ===== */
        .admin-profile {
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            padding: 24px;
            margin-bottom: 24px;
        }

        .admin-profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .admin-profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-secondary);
            flex-shrink: 0;
            overflow: hidden;
        }

        .admin-profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .admin-profile-info h2 {
            margin: 0 0 4px 0;
            font-size: 1.4rem;
        }

        .admin-profile-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .admin-form-group {
            margin-bottom: 16px;
        }

        .admin-form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .admin-form-group input,
        .admin-form-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-sm, 8px);
            border: 1px solid var(--glass-border);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
        }

        .admin-form-group input:focus,
        .admin-form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.15);
        }

        .admin-form-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-sm, 8px);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.15s;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .admin-form-status {
            font-size: 0.85rem;
            margin-top: 8px;
            min-height: 1.2em;
        }

        .admin-form-status.success {
            color: var(--success);
        }

        .admin-form-status.error {
            color: #ef4444;
        }

        /* ===== Модалка создания ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--bg-primary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 28px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            transform: translateY(20px);
            transition: transform 0.2s;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-card h3 {
            margin: 0 0 20px 0;
            font-size: 1.2rem;
        }

        /* ===== Кнопка + рядом с заголовком ===== */
        .admin-section-header {
            padding: 16px;
            margin: 0;
            font-size: 1rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.3rem;
            line-height: 1;
            transition: background 0.15s, transform 0.15s;
        }

        .btn-add:hover {
            background: var(--primary-hover, #4f46e5);
            transform: scale(1.1);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .admin-page {
                padding: 12px;
            }

            .admin-stat {
                flex: 1;
                min-width: 120px;
                padding: 12px;
            }

            .admin-stat-value {
                font-size: 1.2rem;
            }

            .admin-user-table th,
            .admin-user-table td {
                padding: 8px 10px;
            }

            .admin-user-table {
                font-size: 0.8rem;
            }

            .admin-profile-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .admin-profile-avatar {
                width: 60px;
                height: 60px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div id="adminApp" class="admin-page">
        <!-- ========== ЭКРАН ДАШБОРДА ========== -->
        <div id="adminDashboardScreen">
            <div class="admin-header">
                <span class="admin-title">Панель администратора</span>
                <a href="/" class="btn btn-ghost">← К приложению</a>
            </div>
            <div class="admin-stats">
                <div class="admin-stat">
                    <div class="admin-stat-label">Онлайн</div>
                    <div class="admin-stat-value" id="statOnline">0</div>
                </div>
                <div class="admin-stat">
                    <div class="admin-stat-label">Socket-соединений</div>
                    <div class="admin-stat-value" id="statConnections">0</div>
                </div>
                <div class="admin-stat">
                    <div class="admin-stat-label">Redis</div>
                    <div class="admin-stat-value" id="statRedis" style="font-size:1rem;">—</div>
                </div>
            </div>
            <div class="admin-online-list">
                <h3>Пользователи в сети</h3>
                <div id="adminOnlineList"></div>
                <div class="admin-source" id="adminSource"></div>
            </div>

            <div class="admin-user-list"
                style="margin-top:24px; background: var(--bg-secondary); border-radius: var(--radius-md); overflow: hidden;">
                <div class="admin-section-header">
                    <span>Все пользователи <span id="adminTotalUsersCount"
                            style="font-size: 0.8rem; font-weight: 400; color: var(--text-muted);"></span></span>
                    <button class="btn-add" id="adminBtnCreateUser" title="Создать пользователя">+</button>
                </div>
                <div style="overflow-x: auto; -webkit-overflow-scrolling: touch;">
                    <table class="admin-user-table" style="width: 100%; min-width: 500px;">
                        <thead>
                            <tr>
                                <th style="white-space: nowrap;">Пользователь</th>
                                <th style="white-space: nowrap;">Логин / ID</th>
                                <th style="white-space: nowrap;">Роль</th>
                                <th style="white-space: nowrap;">Дата регистрации</th>
                            </tr>
                        </thead>
                        <tbody id="adminAllUsersList"></tbody>
                    </table>
                </div>
                <div id="adminUserPagination"
                    style="display: flex; justify-content: center; align-items: center; gap: 8px; padding: 16px; border-top: 1px solid var(--glass-border); flex-wrap: wrap;">
                </div>
            </div>
            <div class="admin-settings"
                style="margin-top:24px; padding:20px; background:var(--bg-secondary); border-radius:var(--radius-md);">
                <h3 style="margin:0 0 12px 0; font-size:1rem;">Время жизни JWT токена</h3>
                <p style="color:var(--text-muted); font-size:0.9rem; margin:0 0 12px 0;">Выберите срок действия токена
                    авторизации (новые логины получат этот TTL):</p>
                <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                    <select id="adminJwtTtlSelect" class="form-input" style="min-width:180px;">
                        <option value="300">5 минут</option>
                        <option value="3600">1 час</option>
                        <option value="36000">10 часов</option>
                        <option value="86400">1 день</option>
                        <option value="604800">1 неделя</option>
                        <option value="2592000">1 месяц</option>
                        <option value="12960000">5 месяцев</option>
                        <option value="31536000">1 год</option>
                    </select>
                    <button id="adminBtnSaveJwtTtl" class="btn btn-primary">Сохранить</button>
                    <span id="adminJwtTtlStatus" style="font-size:0.85rem; color:var(--text-muted);"></span>
                </div>
            </div>
            <button id="adminBtnRefresh" class="btn btn-secondary" style="margin-top:16px;">Обновить</button>
        </div>

        <!-- ========== ЭКРАН ПРОФИЛЯ ПОЛЬЗОВАТЕЛЯ ========== -->
        <div id="adminProfileScreen" class="hidden">
            <div class="admin-header">
                <span class="admin-title" id="profileScreenTitle">Профиль</span>
                <button class="btn btn-ghost" id="adminBtnBack">← Назад</button>
            </div>
            <div class="admin-profile" id="adminProfileCard">
                <div class="admin-profile-header">
                    <div class="admin-profile-avatar" id="profileAvatar"></div>
                    <div class="admin-profile-info">
                        <h2 id="profileDisplayName"></h2>
                        <div class="admin-profile-meta" id="profileMeta"></div>
                    </div>
                </div>
                <div class="admin-form-group">
                    <label for="profileName">Имя</label>
                    <input type="text" id="profileName" maxlength="64">
                </div>
                <div class="admin-form-group">
                    <label for="profileRole">Роль</label>
                    <select id="profileRole">
                        <option value="user">user</option>
                        <option value="admin">admin</option>
                    </select>
                </div>
                <div class="admin-form-group">
                    <label for="profilePassword">Новый пароль (оставьте пустым, чтобы не менять)</label>
                    <input type="password" id="profilePassword" placeholder="••••••••" autocomplete="new-password">
                </div>
                <div class="admin-form-actions">
                    <button class="btn btn-primary" id="adminBtnSaveProfile">💾 Сохранить</button>
                    <button class="btn-danger" id="adminBtnDeleteUser">🗑 Удалить пользователя</button>
                </div>
                <div class="admin-form-status" id="profileStatus"></div>
            </div>
        </div>
    </div>

    <!-- ========== МОДАЛКА СОЗДАНИЯ ========== -->
    <div class="modal-overlay" id="createUserModal">
        <div class="modal-card">
            <h3>Новый пользователь</h3>
            <div class="admin-form-group">
                <label for="newUserLogin">Логин</label>
                <input type="text" id="newUserLogin" maxlength="64" autocomplete="off">
            </div>
            <div class="admin-form-group">
                <label for="newUserName">Имя</label>
                <input type="text" id="newUserName" maxlength="64">
            </div>
            <div class="admin-form-group">
                <label for="newUserPassword">Пароль</label>
                <input type="password" id="newUserPassword" autocomplete="new-password">
            </div>
            <div class="admin-form-group">
                <label for="newUserRole">Роль</label>
                <select id="newUserRole">
                    <option value="user">user</option>
                    <option value="admin">admin</option>
                </select>
            </div>
            <div class="admin-form-actions">
                <button class="btn btn-primary" id="modalBtnCreate">Создать</button>
                <button class="btn btn-ghost" id="modalBtnCancel">Отмена</button>
            </div>
            <div class="admin-form-status" id="createUserStatus"></div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>

</html>
