<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=2.0.0">
    <style>
        .admin-page { max-width: 900px; margin: 0 auto; padding: 24px; }
        .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .admin-title { font-size: 1.5rem; font-weight: 700; }
        .admin-stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
        .admin-stat { background: var(--bg-secondary); padding: 16px 20px; border-radius: var(--radius-md); min-width: 140px; }
        .admin-stat-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
        .admin-stat-value { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
        .admin-online-list { background: var(--bg-secondary); border-radius: var(--radius-md); overflow: hidden; }
        .admin-online-list h3 { padding: 16px; margin: 0; font-size: 1rem; border-bottom: 1px solid var(--glass-border); }
        .admin-online-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .admin-online-item:last-child { border-bottom: none; }
        .admin-online-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-input); display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--text-secondary); }
        .admin-online-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .admin-online-name { font-weight: 500; }
        .admin-online-id { font-size: 0.75rem; color: var(--text-muted); }
        .admin-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; background: var(--success); color: white; }
        .admin-source { font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; }
    </style>
</head>
<body>
    <div id="adminApp" class="admin-page">
        <div id="adminDashboardScreen">
            <div class="admin-header">
                <span class="admin-title">Панель администратора</span>
                <a href="/" class="btn btn-ghost">← К приложению</a>
            </div>
            <div class="admin-stats">
                <div class="admin-stat">
                    <div class="admin-stat-label">Онлайн</div>
                    <div class="admin-stat-value" id="statOnline">0</div>
                </div>
                <div class="admin-stat">
                    <div class="admin-stat-label">Socket-соединений</div>
                    <div class="admin-stat-value" id="statConnections">0</div>
                </div>
                <div class="admin-stat">
                    <div class="admin-stat-label">Redis</div>
                    <div class="admin-stat-value" id="statRedis" style="font-size:1rem;">—</div>
                </div>
            </div>
            <div class="admin-online-list">
                <h3>Пользователи в сети</h3>
                <div id="adminOnlineList"></div>
                <div class="admin-source" id="adminSource"></div>
            </div>
            <div class="admin-settings" style="margin-top:24px; padding:20px; background:var(--bg-secondary); border-radius:var(--radius-md);">
                <h3 style="margin:0 0 12px 0; font-size:1rem;">Время жизни JWT токена</h3>
                <p style="color:var(--text-muted); font-size:0.9rem; margin:0 0 12px 0;">Выберите срок действия токена авторизации (новые логины получат этот TTL):</p>
                <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                    <select id="adminJwtTtlSelect" class="form-input" style="min-width:180px;">
                        <option value="300">5 минут</option>
                        <option value="3600">1 час</option>
                        <option value="36000">10 часов</option>
                        <option value="86400">1 день</option>
                        <option value="604800">1 неделя</option>
                        <option value="2592000">1 месяц</option>
                        <option value="12960000">5 месяцев</option>
                        <option value="31536000">1 год</option>
                    </select>
                    <button id="adminBtnSaveJwtTtl" class="btn btn-primary">Сохранить</button>
                    <span id="adminJwtTtlStatus" style="font-size:0.85rem; color:var(--text-muted);"></span>
                </div>
            </div>
            <button id="adminBtnRefresh" class="btn btn-secondary" style="margin-top:16px;">Обновить</button>
        </div>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
