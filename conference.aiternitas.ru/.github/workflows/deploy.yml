name: Deploy Conference to Production

on:
  push:
    branches:
      - master
      - main
      - production
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Conference to apk.aiternitas.ru
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SERVER_HOST || '82.146.44.126' }}
      SSH_USER: ${{ secrets.SERVER_USER || 'root' }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      PERSISTENCE_DRIVER: postgres
      PGSSLMODE: disable

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check required secrets
        shell: bash
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "⚠️  SSH_PRIVATE_KEY secret is not set. Deployment steps will be skipped."
            echo "skip_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_deploy=false" >> "$GITHUB_OUTPUT"
          fi
        id: secrets_check

      - name: Setup SSH key
        if: steps.secrets_check.outputs.skip_deploy == 'false'
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy Conference
        if: steps.secrets_check.outputs.skip_deploy == 'false'
        run: |
          set -e
          SSH_HOST="${{ env.SSH_HOST }}"
          SSH_USER="${{ env.SSH_USER }}"
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "bash -s" <<EOSSH
            set -e
            REPO_DIR="/opt/conference"
            
            # Создаем директорию если не существует
            if [ ! -d "$REPO_DIR" ]; then
              mkdir -p "$REPO_DIR"
              cd "$REPO_DIR"
              git init
              git remote add origin git@github.com:ebusorgin/conference.git || true
            fi
            
            cd "$REPO_DIR"
            git config --global --add safe.directory "$REPO_DIR" || true
            git fetch origin
            git checkout production || git checkout -b production
            git reset --hard origin/production
            
            # Установка зависимостей
            if [ -f "package.json" ]; then
              npm install --production
            fi
            
            # Создание .env (secrets с runner)
            cp /opt/conference/.env /opt/conference/.env.bak 2>/dev/null || true
            echo "PORT=3000
HOST=0.0.0.0
NODE_ENV=production
PERSISTENCE_DRIVER=postgres
PGSSLMODE=disable
DATABASE_URL=$DATABASE_URL
REDIS_URL=$REDIS_URL
ADMIN_SECRET=$ADMIN_SECRET
VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY
VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY
VAPID_MAILTO=mailto:conference@aiternitas.ru" > /opt/conference/.env
            
            # Сид админа (логин: admin, пароль: SevAdmin2026!)
            node scripts/seed-admin.mjs 2>/dev/null || true
            
            # Перезапуск сервиса
            systemctl restart conference.service || echo "Service conference.service not found, will be created"
            sleep 2
            systemctl status conference.service --no-pager | head -10 || true
            echo ""
          EOSSH

      - name: Verify deployment
        if: steps.secrets_check.outputs.skip_deploy == 'false'
        run: |
          set -e
          SSH_HOST="${{ env.SSH_HOST }}"
          SSH_USER="${{ env.SSH_USER }}"
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} <<'EOSSH'
            set -e
            
            echo "=== Conference Service Status ==="
            systemctl status conference.service --no-pager | head -10 || echo "Service not found"
            
            echo ""
            echo "=== Last Commit ==="
            cd /opt/conference && git log --oneline -1 || echo "No commits yet"
            
            echo ""
            echo "=== Service Health ==="
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || echo "000")
            echo "Conference (3000) HTTP status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Conference service is responding"
            else
              echo "⚠️ Conference service may not be responding correctly"
            fi
          EOSSH

      - name: Skip notice
        if: steps.secrets_check.outputs.skip_deploy == 'true'
        run: |
          echo "🔕 Deployment skipped because SSH_PRIVATE_KEY secret is not configured."

              echo "✅ Conference service is responding"
            else
              echo "⚠️ Conference service may not be responding correctly"
            fi
          EOSSH

      - name: Skip notice
        if: steps.secrets_check.outputs.skip_deploy == 'true'
        run: |
          echo "🔕 Deployment skipped because SSH_PRIVATE_KEY secret is not configured."

