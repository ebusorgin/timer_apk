# HTTP-only конфиг для первого деплоя (до certbot)
# После: certbot --nginx -d remote.aiternitas.ru

server {
    listen 80;
    listen [::]:80;
    server_name remote.aiternitas.ru;

    access_log /var/log/nginx/remote.aiternitas.ru-access.log;
    error_log /var/log/nginx/remote.aiternitas.ru-error.log;

    client_max_body_size 5M;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
