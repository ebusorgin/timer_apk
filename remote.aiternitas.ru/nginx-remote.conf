# Конфигурация nginx для поддомена remote.aiternitas.ru
# После первого деплоя: certbot --nginx -d remote.aiternitas.ru

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name remote.aiternitas.ru;

    ssl_certificate /etc/letsencrypt/live/remote.aiternitas.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remote.aiternitas.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/remote.aiternitas.ru-access.log;
    error_log /var/log/nginx/remote.aiternitas.ru-error.log;

    client_max_body_size 5M;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

server {
    listen 80;
    listen [::]:80;
    server_name remote.aiternitas.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}
