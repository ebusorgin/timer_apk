server {
    server_name vpn.aiternitas.ru;

    access_log /var/log/nginx/vpn.aiternitas.ru-access.log;
    error_log /var/log/nginx/vpn.aiternitas.ru-error.log;

    location = /vpn-app.apk {
        alias /opt/vpn/public/vpn-app.apk;
        add_header Content-Type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=vpn-app.apk";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/vpn.aiternitas.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.aiternitas.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = vpn.aiternitas.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name vpn.aiternitas.ru;
    return 404;
}
